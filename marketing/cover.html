<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1260,initial-scale=1">
  <meta name="description" content="Little Vac cover using the game's workshop title artwork.">
  <title>Little Vac — Cover artwork</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:1260px;height:1000px;overflow:hidden;background:#17292d;color:#f2e6c9}
    body{font-family:Arial,Helvetica,sans-serif}.cover{position:relative;width:1260px;height:1000px;overflow:hidden}
    canvas{position:absolute;display:block;width:1500px;height:1000px;left:-110px;top:0}
    h1{position:absolute;left:76px;top:112px;margin:0;font:900 202px/.86 Impact,'Arial Black',Arial,sans-serif;letter-spacing:-3px;color:#f2e6c9;text-shadow:5px 6px 0 #0d1b20;transform:rotate(-3deg);transform-origin:left center}
    h1 span{display:block;color:#ee7951}.tagline{position:absolute;left:80px;top:552px;margin:0;font-size:36px;line-height:1.35;font-weight:700}
    .details{position:absolute;left:80px;bottom:85px;margin:0;padding-top:19px;border-top:4px solid #ce5b3e;font:700 17px/1.7 'Courier New',monospace;letter-spacing:1px;color:#c3cec6}
  </style>
</head>
<body><main class="cover" aria-label="Little Vac: a vacuum robot leaving a clean trail across a workshop floor.">
  <canvas id="coverArt" width="1500" height="1000" aria-hidden="true"></canvas>
  <h1>LITTLE <span>VAC</span></h1>
  <p class="tagline">Clean rooms.<br>Upgrade your vacuum.</p>
  <p class="details">24 JOBS · 50 AREAS<br>ENDLESS SHIFT TO UNLOCK</p>
</main><script type="module">import {drawTitle} from '../render.js';const canvas=document.querySelector('#coverArt'),ctx=canvas.getContext('2d');ctx.scale(1500/960,1000/640);drawTitle(ctx,0,true);document.documentElement.dataset.coverReady='true';</script></body>
</html>
